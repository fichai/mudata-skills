name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar zips
        run: bash scripts/build-zips.sh
      - name: Subir a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/mudafy-informes.zip dist/mudata-reglas.zip dist/mudafy-analisis-adquisicion.zip
